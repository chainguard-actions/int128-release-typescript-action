name: Test patch increment-level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: '1'
      GITHUB_SERVER_URL: https://github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake event payload
        run: |
          echo '{}' > /tmp/event.json
          echo "GITHUB_EVENT_PATH=/tmp/event.json" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          major-version: '1'
          increment-level: patch
          dry-run: 'true'
          token: fake-token

      - name: Assert action accepted patch as a valid increment-level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should NOT fail with an assertion error about increment-level
          # It may fail later at git fetch or API calls (expected with fake token)
          # But if it fails, it should not be due to invalid increment-level input
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "PASS: action failed at a later stage (not at input validation) — patch is a valid increment-level"
          fi
          echo "PASS: 'patch' is accepted as a valid increment-level value"
