name: Test dry-run with patch increment level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with patch increment-level in dry-run mode
        id: action
        uses: .
        with:
          major-version: '2'
          increment-level: 'patch'
          dry-run: 'true'
          token: 'fake-token'
        continue-on-error: true

      - name: Assert action failed at API level (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it cannot authenticate with GitHub API
          # using a fake token. 'patch' is a valid increment-level value, so the
          # action should not fail at input validation.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real token), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted 'patch' as increment-level and failed at API/network level"
