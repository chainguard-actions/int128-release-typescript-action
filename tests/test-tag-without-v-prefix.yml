name: Test tag ref without v prefix is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Record state before
        id: before
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "status=$(git status --porcelain | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/tags/1.0.0
          GITHUB_EVENT_NAME: push
        with:
          major-version: "1"
          increment-level: patch
          dry-run: "true"
      - name: Assert action failed before modifying the workspace
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
          BEFORE_STATUS: ${{ steps.before.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for tag '1.0.0' (no v prefix), got '$OUTCOME'"
            exit 1
          fi
          AFTER_SHA="$(git rev-parse HEAD)"
          AFTER_STATUS="$(git status --porcelain | sha256sum | cut -d' ' -f1)"
          echo "sha before/after: $BEFORE_SHA / $AFTER_SHA"
          echo "status before/after: $BEFORE_STATUS / $AFTER_STATUS"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "FAIL: HEAD changed"
            exit 1
          fi
          if [ "$BEFORE_STATUS" != "$AFTER_STATUS" ]; then
            echo "FAIL: working tree was modified"
            git status --porcelain
            exit 1
          fi
          echo "PASS"
