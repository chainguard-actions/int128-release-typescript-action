name: Test major tag without any version tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up local origin with only a v1 tag
        id: setup
        run: |
          set -e
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "origin=$(git remote get-url origin 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -l | xargs -r git tag -d
          git tag v1
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          echo "/.git-remote" >> .git/info/exclude
      - id: action
        uses: .
        continue-on-error: true
        with:
          major-version: '1'
          increment-level: minor
          dry-run: 'true'
      - name: Assert action failed before creating a release commit
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BEFORE: ${{ steps.setup.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when v1 does not point to a version tag"
            exit 1
          fi
          AFTER="$(git rev-parse HEAD)"
          echo "before: $BEFORE after: $AFTER"
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "FAIL: a commit was created despite the error"
            exit 1
          fi
          echo "PASS"
      - name: Restore repository state
        if: always()
        env:
          ORIG_SHA: ${{ steps.setup.outputs.sha }}
          ORIG_ORIGIN: ${{ steps.setup.outputs.origin }}
        run: |
          git checkout -f act-harness 2>/dev/null || true
          git reset --hard "$ORIG_SHA" || true
          git tag -l | xargs -r git tag -d || true
          if [ -n "$ORIG_ORIGIN" ]; then git remote set-url origin "$ORIG_ORIGIN" || true; fi
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
