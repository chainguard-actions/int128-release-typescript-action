name: Test dry-run on branch push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in dry-run mode on branch push (expect failure at API level)
        id: action
        uses: .
        with:
          major-version: '1'
          increment-level: 'minor'
          dry-run: 'true'
          token: 'fake-token'
        continue-on-error: true

      - name: Assert action failed (expected - no real GitHub token available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it cannot authenticate with GitHub API
          # using a fake token, but it should NOT fail due to input validation.
          # A failure here means the action correctly processed inputs and
          # attempted real operations (git fetch / GitHub API calls).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real token), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly attempted operations and failed at API/network level"
