name: Test major tag pointing to multiple version tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up local origin with ambiguous version tags
        id: setup
        run: |
          set -e
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -l | xargs -r git tag -d
          git tag v97.0.0
          git tag v97.1.0
          git tag v97
          rm -rf /tmp/origin-multi.git
          git init --bare /tmp/origin-multi.git
          git -C /tmp/origin-multi.git config receive.shallowUpdate true
          git push /tmp/origin-multi.git HEAD:refs/heads/act-harness
          git push /tmp/origin-multi.git --tags
          git remote set-url origin /tmp/origin-multi.git 2>/dev/null || \
            git remote add origin /tmp/origin-multi.git
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          major-version: "97"
          increment-level: patch
          dry-run: "true"
      - name: Assert action failed and made no release commit
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BEFORE: ${{ steps.setup.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when v97 points to multiple version tags, got '$OUTCOME'"
            exit 1
          fi
          AFTER="$(git rev-parse HEAD)"
          echo "before: $BEFORE after: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: a commit was created"
            exit 1
          fi
          echo "PASS"
