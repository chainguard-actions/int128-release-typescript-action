name: Test invalid increment-level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Record HEAD
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          increment-level: major
          dry-run: 'true'
      - name: Assert action failed on invalid input without touching git
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for increment-level=major"
            exit 1
          fi
          AFTER="$(git rev-parse HEAD)"
          echo "before: $BEFORE after: $AFTER"
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "FAIL: HEAD changed despite invalid input"
            exit 1
          fi
          echo "PASS"
