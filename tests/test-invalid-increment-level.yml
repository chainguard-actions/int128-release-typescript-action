name: Test invalid increment-level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          major-version: '1'
          increment-level: invalid
          dry-run: 'true'
          token: ${{ github.token }}
        env:
          GITHUB_REF: refs/heads/act-harness
          GITHUB_EVENT_NAME: workflow_dispatch

      - name: Assert action failed with invalid increment-level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid increment-level"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid increment-level 'invalid'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
