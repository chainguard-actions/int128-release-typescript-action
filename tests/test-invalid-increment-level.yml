name: Test invalid increment-level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid increment-level (expect failure)
        id: action
        uses: .
        with:
          major-version: '1'
          increment-level: 'invalid'
          dry-run: 'true'
          token: 'fake-token'
        continue-on-error: true

      - name: Assert action failed due to invalid increment-level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid increment-level, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid increment-level"
