name: Test invalid increment-level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - id: action
        uses: .
        continue-on-error: true
        with:
          major-version: '1'
          increment-level: invalid
          dry-run: 'true'

      - name: Assert action failed with invalid increment-level
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid increment-level"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid increment-level 'invalid'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
