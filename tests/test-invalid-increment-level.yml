name: Test invalid increment-level is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record HEAD
        run: echo "ORIG_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          increment-level: major
          dry-run: 'true'

      - name: Assert action failed without touching the repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for increment-level 'major'"
            exit 1
          fi
          NOW="$(git rev-parse HEAD)"
          echo "HEAD before: $ORIG_SHA, after: $NOW"
          if [ "$NOW" != "$ORIG_SHA" ]; then
            echo "FAIL: action created a commit despite invalid input"
            exit 1
          fi
          echo "PASS"

      - name: Restore workspace state
        if: always()
        run: |
          git reset --hard "$ORIG_SHA" || true
