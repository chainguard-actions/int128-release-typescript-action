name: Test dry-run on branch push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: '1'
      GITHUB_SERVER_URL: https://github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake event payload
        run: |
          echo '{}' > /tmp/event.json
          echo "GITHUB_EVENT_PATH=/tmp/event.json" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          major-version: '1'
          increment-level: minor
          dry-run: 'true'
          token: fake-token

      - name: Assert action did not fail due to input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at git fetch or API call (not at input validation)
          # A failure here is expected since we have no real token/remote
          # But it must NOT succeed with a fake token (that would be unexpected)
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded with a fake token — this may indicate dry-run skipped all operations"
          fi
          # The key assertion: the action must not fail with "increment-level must be either"
          # which would indicate input validation failure (we passed valid inputs)
          echo "PASS: action processed valid inputs correctly (outcome: $OUTCOME)"
